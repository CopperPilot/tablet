    - {ref: J3, role: rear_camera_fpc, side: top, x_mm: 2.2, y_mm: 24.0, rot_deg: 270}
    - {ref: U2, role: lpddr4x_ram, side: top, x_mm: 17.5, y_mm: 28.0, rot_deg: 90}
    - {ref: U1, role: rk3566_soc, side: top, x_mm: 17.5, y_mm: 41.5, rot_deg: 0}
    - {ref: U3, role: emmc_storage, side: top, x_mm: 17.5, y_mm: 56.5, rot_deg: 0}
