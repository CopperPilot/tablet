      top: 3.5
      bottom: 1.0
bom:
  - {refs: [U1], role: soc, mpn: RK3566, lcsc: C2943786, footprint: "lcsc:BGA-565_L15.5-W14.4-P0.40_RK3566_1", description: "Rockchip RK3566 quad-core Cortex-A55 SoC"}
  - {refs: [U2], role: lpddr4x, mpn: K4FBE3D4HM-MGCJ, lcsc: C19188580, footprint: "lcsc:FBGA-200_L15.0-W10.0-BL_K4F6E3S4HM", description: "4 GB (32 Gbit) x32 LPDDR4X SDRAM, 200-ball FBGA"}
