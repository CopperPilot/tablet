    - {ref: U6, role: backlight_driver, side: top, x_mm: 10.0, y_mm: 68.0, rot_deg: 0}
    - {ref: J2, role: touch_fpc, side: top, x_mm: 2.2, y_mm: 88.0, rot_deg: 270}
    - {ref: U9, role: touch_controller, side: top, x_mm: 9.0, y_mm: 88.0, rot_deg: 0}
