schema_version: rea-hardware/spec/v1
product:
  slug: compact-tablet
  name: Compact 8.4-inch Android Tablet
  summary: "8.4-inch 1600x2560 dual-DSI Android tablet with RK3566 SoC, 4 GB LPDDR4X, 64 GB eMMC 5.1, RK817 PMIC, CNC aluminium back shell, dual cameras, stereo speakers, and USB-C daughterboard"
  category: tablet
inputs:
  images: [inputs/front_back.jpg, inputs/rear_side.jpg, inputs/teardown.jpg]
  views:
    front: inputs/front_back.jpg
    rear: inputs/rear_side.jpg
  prompt: inputs/prompt.md
envelope:
  width_mm: 134.0
  height_mm: 198.0
  depth_mm: 9.4
  corner_radius_mm: 14.0
  derivation: "User specification: 134 x 198 x 9.4 mm (scaled from 132.6 x 195.3 mm reference to fit 3.2 mm thick Sharp LQ084R1SX01 8.4-inch display stackup; 10.4 mm thick at 1.0 mm proud rear camera ring)"
  front_origin_world_mm: [-103.0, 22.0, 6.6]
fidelity:
  out_of_scope:
    - magnetic stylus charging strip on side wall
    - cellular 5G baseband and SIM tray
    - fingerprint sensor inside top power button
    - rear brand logo
  dimensions:
    - {name: overall_width, kind: overall_width, value_mm: 134.0, tol_mm: 1.0, source: "prompt specification and rear_side.jpg"}
    - {name: overall_height, kind: overall_height, value_mm: 198.0, tol_mm: 1.0, source: "prompt specification and rear_side.jpg"}
    - {name: overall_depth, kind: overall_depth, value_mm: 9.4, tol_mm: 1.0, source: "prompt specification: 9.4 mm body, 10.4 mm at camera bump"}
    - {name: corner_radius, kind: corner_radius, value_mm: 14.0, tol_mm: 1.0, source: "prompt specification: 14 mm plan-view corner radius"}
    - {name: center_thickness, kind: center_thickness, value_mm: 9.4, tol_mm: 0.5, source: "prompt layer stackup: 1.1 + 3.2 + 0.3 + 3.8 + 1.0 = 9.4 mm"}
    - {name: edge_thickness, kind: edge_thickness, value_mm: 9.0, tol_mm: 1.0, source: "flat CNC aluminium back shell with rounded perimeter edges"}
    - {name: side_bezel, kind: bezel, value_mm: 10.5, tol_mm: 1.5, source: "(134.0 - 113.04) / 2 = 10.48 mm side bezel around LQ084R1SX01 active area"}
  must_match:
    - id: F_DISPLAY
      name: 8.4-inch 1600x2560 display active window
      kind: display
      view: front
      center_mm: [67.0, 99.0]
      size_mm: [113.04, 180.86]
      implement: case
      source: photo
      confidence: high
      notes: "Sharp LQ084R1SX01 active area 113.04 x 180.864 mm under full-face cover glass"
    - id: F_FRONT_CAM
      name: Front MIPI-CSI camera window
      kind: sensor
      view: front
      center_mm: [67.0, 5.2]
      size_mm: [3.0, 3.0]
      implement: case
      source: photo
      confidence: high
      notes: "Centred in top front bezel"
    - id: F_REAR_CAM
      name: Rear camera raised lens ring
      kind: sensor
      view: rear
      center_mm: [14.8, 14.8]
      size_mm: [13.5, 13.5]
      implement: case
      source: photo
      confidence: high
      notes: "13.5 mm OD raised ring, 1.0 mm proud of back shell (10.4 mm total thickness at bump)"
    - id: F_REAR_MIC
      name: Rear microphone acoustic pinhole
      kind: sensor
      view: rear
      center_mm: [14.8, 24.6]
      size_mm: [1.0, 1.0]
      implement: pcb+case
      source: photo
      confidence: high
      notes: "1.0 mm diameter hole on rear camera centreline, backed by MEMS mic MK1 on mainboard"
    - id: F_REAR_FLASH
      name: Rear LED flash diffuser window
      kind: led
      view: rear
      center_mm: [14.8, 33.0]
      size_mm: [5.6, 5.6]
      implement: pcb+case
      source: photo
      confidence: high
      notes: "5.6 mm diameter window on rear camera centreline, backed by flash LED D1 on mainboard"
    - id: F_USBC
      name: Bottom USB-C receptacle opening
      kind: port
      view: bottom
      center_mm: [67.0, 4.7]
      size_mm: [9.2, 3.5]
      implement: case
      source: photo
      confidence: high
      notes: "Centred on bottom edge wall, backed by J1 on usbc_board"
    - id: F_BTN_PWR
      name: Top power button
      kind: button
      view: top
      center_mm: [109.8, 4.7]
      size_mm: [12.0, 2.8]
      implement: case
      source: photo
      confidence: high
      notes: "Top edge power button near corner above camera, actuating button_flex"
    - id: F_BTN_VOL_UP
      name: Volume up button
      kind: button
      view: top
      center_mm: [32.0, 4.7]
      size_mm: [10.0, 2.8]
      implement: case
      source: photo
      confidence: high
      notes: "Top edge volume-up button actuating button_flex"
    - id: F_BTN_VOL_DN
      name: Volume down button
      kind: button
      view: top
      center_mm: [19.8, 4.7]
      size_mm: [10.0, 2.8]
      implement: case
      source: photo
      confidence: high
      notes: "Top edge volume-down button actuating button_flex"
fab:
  profile: jlcpcb
  layers: 8
  thickness_mm: 0.8
  assembly_sides: [top, bottom]
electrical:
  mcu: "Rockchip RK3566 quad-core Cortex-A55 SoC (LCSC C2943786, BGA-565 15.5x14.4mm)"
  power: "1S 3.8V 5600mAh (21.28Wh) Li-Po battery pack via 3-pin connector + USB-C 5V/3A sink (5.1k CC pull-downs on daughterboard) -> RK817-5 PMIC (charger, fuel gauge, 5 bucks, 9 LDOs, audio codec) + RK860-0 (TCS4525-class) external VDD_CPU buck + TPS61165DRVR WLED backlight boost + AW3641EDNR flash LED boost"
  blocks:
    - id: compute
      purpose: "Rockchip RK3566 SoC, 4 GB LPDDR4X x32 (within 15 mm of SoC), 64 GB eMMC 5.1 (153-ball), 24 MHz crystal, solder-down RF shield frame"
      key_parts: [RK3566, K4FBE3D4HM-MGCJ, FEMDNN064G-C9A61, KH-PBJ-440808]
      reference: "https://github.com/PuntoMaximo/VonVisionAI_hardware (Hardware/Board.kicad_sch) and Rockchip RK3566 Hardware Design Guide v1.1"
    - id: power_pmic
      purpose: "RK817-5 integrated PMIC (SoC rails, switching Li-Ion charger, fuel gauge, audio codec), RK860-0 (TCS4525-class) dedicated VDD_CPU buck, 3-pin battery connector (V+, NTC, GND), PMIC shield frame"
      key_parts: [RK817-5, RK860-0, DF58-4P-1.2V(21)]
      reference: "Rockchip RK3566 Reference Schematic (RK817 + TCS4525 power tree)"
    - id: display_touch_backlight
      purpose: "Dual-channel 4-lane MIPI-DSI (DSI0 + DSI1) 40-pin FPC connector to Sharp LQ084R1SX01, TPS61165DRVR WLED boost backlight driver with PWM dimming, 10-pin touch FPC with MPR121QR2 I2C touch controller (I2C + INT + RST)"
      key_parts: [FPC-0.5HF-40PWBH10, TPS61165DRVR, 0.5K-QX-10PWB, MPR121QR2]
      reference: "Sharp LQ101R1SX01 / LQ084R1SX01 dual-DSI interface specification"
    - id: cameras_flash_mic
      purpose: "Rear 30-pin MIPI-CSI camera FPC connector, front 24-pin MIPI-CSI camera FPC connector, AW3641EDNR flash LED driver + rear KT-0603W flash LED, rear MSM261DCB002 MEMS microphone"
      key_parts: [0.5K-QX-30PWB, FPC-0.5HF-24PWBH10, AW3641EDNR, KT-0603W, MSM261DCB002]
      reference: "https://github.com/PuntoMaximo/VonVisionAI_hardware (MIPI-CSI & audio sections)"
    - id: wifi_bt_rf
      purpose: "RTL8723DS-CG SDIO Wi-Fi + UART Bluetooth combo IC with 50-ohm feed to ANT3216A063R2400A chip antenna aligned with top-edge plastic RF window"
      key_parts: [RTL8723DS-CG, ANT3216A063R2400A]
      reference: "Rockchip RK3566 SDIO Wi-Fi/BT reference design"
    - id: audio_io_subboards
      purpose: "NS4150B Class-D speaker amplifier + RK817-5 internal Class-D speaker driver for top/bottom landscape stereo speakers, 16-pin FPC link to USB-C daughterboard (USB 2.0 OTG D+/D-, CC1/CC2, VBUS), 4-pin FPC link to button flex board, UART/Maskrom/rail test pads"
      key_parts: [NS4150B, 0.5K-QX-16PWB, 0.5K-QX-4PWB, TYPE-C-31-M-12, USBLC6-2P6, B3U-3000P]
      reference: "Rockchip RK3566 Hardware Design Guide v1.1 Section 3.6 USB 2.0 OTG & Boot/Maskrom"
  nets_must_connect:
    - ["U1.USB_OTG0_DP", "J6.1"]
    - ["U1.USB_OTG0_DM", "J6.2"]
    - ["U3.SW", "L1.1"]
    - ["U6.SW", "L7.1"]
  high_speed:
    - name: lpddr4x_byte0_ch_a
      kind: length_match
      nets: ["LPDDR4_DQ0_A", "LPDDR4_DQ1_A", "LPDDR4_DQ2_A", "LPDDR4_DQ3_A", "LPDDR4_DQ4_A", "LPDDR4_DQ5_A", "LPDDR4_DQ6_A", "LPDDR4_DQ7_A", "LPDDR4_DM0_A", "LPDDR4_DQS0P_A", "LPDDR4_DQS0N_A"]
      tolerance_mm: 2.5
      impedance_ohm: 40.0
      diff_impedance_ohm: 80.0
      source: "Rockchip RK3566 Hardware Design Guide v1.1 Section 3.3 LPDDR4X Byte Lane Routing (L3)"
    - name: lpddr4x_byte1_ch_a
      kind: length_match
      nets: ["LPDDR4_DQ8_A", "LPDDR4_DQ9_A", "LPDDR4_DQ10_A", "LPDDR4_DQ11_A", "LPDDR4_DQ12_A", "LPDDR4_DQ13_A", "LPDDR4_DQ14_A", "LPDDR4_DQ15_A", "LPDDR4_DM1_A", "LPDDR4_DQS1P_A", "LPDDR4_DQS1N_A"]
      tolerance_mm: 2.5
      impedance_ohm: 40.0
      diff_impedance_ohm: 80.0
      source: "Rockchip RK3566 Hardware Design Guide v1.1 Section 3.3 LPDDR4X Byte Lane Routing (L3)"
    - name: lpddr4x_byte2_ch_b
      kind: length_match
      nets: ["LPDDR4_DQ0_B", "LPDDR4_DQ1_B", "LPDDR4_DQ2_B", "LPDDR4_DQ3_B", "LPDDR4_DQ4_B", "LPDDR4_DQ5_B", "LPDDR4_DQ6_B", "LPDDR4_DQ7_B", "LPDDR4_DM0_B", "LPDDR4_DQS0P_B", "LPDDR4_DQS0N_B"]
      tolerance_mm: 2.5
      impedance_ohm: 40.0
      diff_impedance_ohm: 80.0
      source: "Rockchip RK3566 Hardware Design Guide v1.1 Section 3.3 LPDDR4X Byte Lane Routing (L3)"
    - name: lpddr4x_byte3_ch_b
      kind: length_match
      nets: ["LPDDR4_DQ8_B", "LPDDR4_DQ9_B", "LPDDR4_DQ10_B", "LPDDR4_DQ11_B", "LPDDR4_DQ12_B", "LPDDR4_DQ13_B", "LPDDR4_DQ14_B", "LPDDR4_DQ15_B", "LPDDR4_DM1_B", "LPDDR4_DQS1P_B", "LPDDR4_DQS1N_B"]
      tolerance_mm: 2.5
      impedance_ohm: 40.0
      diff_impedance_ohm: 80.0
      source: "Rockchip RK3566 Hardware Design Guide v1.1 Section 3.3 LPDDR4X Byte Lane Routing (L3)"
    - name: lpddr4x_ca_bus
      kind: length_match
      nets: ["LPDDR4_A0_A", "LPDDR4_A1_A", "LPDDR4_A2_A", "LPDDR4_A3_A", "LPDDR4_A4_A", "LPDDR4_A5_A", "LPDDR4_A0_B", "LPDDR4_A1_B", "LPDDR4_A2_B", "LPDDR4_A3_B", "LPDDR4_A4_B", "LPDDR4_A5_B", "LPDDR4_CKE0_A", "LPDDR4_CKE1_A", "LPDDR4_CKE0_B", "LPDDR4_CKE1_B", "LPDDR4_CS0N_A", "LPDDR4_CS1N_A", "LPDDR4_CS0N_B", "LPDDR4_CS1N_B", "LPDDR4_CLKP_A", "LPDDR4_CLKN_A", "LPDDR4_CLKP_B", "LPDDR4_CLKN_B"]
      tolerance_mm: 3.0
      impedance_ohm: 40.0
      diff_impedance_ohm: 80.0
      source: "Rockchip RK3566 Hardware Design Guide v1.1 Section 3.3 LPDDR4X Command/Address & Clock Routing (L6)"
    - name: mipi_dsi0
      kind: diff_pairs
      nets: ["MIPI_DSI_TX0_D0P", "MIPI_DSI_TX0_D0N", "MIPI_DSI_TX0_D1P", "MIPI_DSI_TX0_D1N", "MIPI_DSI_TX0_D2P", "MIPI_DSI_TX0_D2N", "MIPI_DSI_TX0_D3P", "MIPI_DSI_TX0_D3N", "MIPI_DSI_TX0_CLKP", "MIPI_DSI_TX0_CLKN"]
      tolerance_mm: 1.25
      diff_impedance_ohm: 100.0
      source: "Rockchip RK3566 Hardware Design Guide v1.1 Section 3.8 MIPI-DSI0 4-Lane Differential Routing (L6)"
    - name: mipi_dsi1
      kind: diff_pairs
      nets: ["MIPI_DSI_TX1_D0P", "MIPI_DSI_TX1_D0N", "MIPI_DSI_TX1_D1P", "MIPI_DSI_TX1_D1N", "MIPI_DSI_TX1_D2P", "MIPI_DSI_TX1_D2N", "MIPI_DSI_TX1_D3P", "MIPI_DSI_TX1_D3N", "MIPI_DSI_TX1_CLKP", "MIPI_DSI_TX1_CLKN"]
      tolerance_mm: 1.25
      diff_impedance_ohm: 100.0
      source: "Rockchip RK3566 Hardware Design Guide v1.1 Section 3.8 MIPI-DSI1 4-Lane Differential Routing (L6)"
    - name: mipi_csi_cameras
      kind: diff_pairs
      nets: ["MIPI_CSI_RX_D0P", "MIPI_CSI_RX_D0N", "MIPI_CSI_RX_D1P", "MIPI_CSI_RX_D1N", "MIPI_CSI_RX_D2P", "MIPI_CSI_RX_D2N", "MIPI_CSI_RX_D3P", "MIPI_CSI_RX_D3N", "MIPI_CSI_RX_CLK0P", "MIPI_CSI_RX_CLK0N", "MIPI_CSI_RX_CLK1P", "MIPI_CSI_RX_CLK1N"]
      tolerance_mm: 1.25
      diff_impedance_ohm: 100.0
      source: "Rockchip RK3566 Hardware Design Guide v1.1 Section 3.8 MIPI-CSI Dual Camera Differential Routing (L6)"
    - name: usb2_otg
      kind: diff_pairs
      nets: ["USB_OTG0_DP", "USB_OTG0_DM"]
      tolerance_mm: 1.5
      diff_impedance_ohm: 90.0
      source: "Rockchip RK3566 Hardware Design Guide v1.1 Section 3.6 USB 2.0 90-Ohm Differential Routing (L6)"
board:
  width_mm: 28.0
  height_mm: 125.0
  corner_radius_mm: 3.0
  mounting_holes:
    - {x_mm: 24.5, y_mm: 4.0, drill_mm: 1.5, plated: true}
    - {x_mm: 3.5, y_mm: 6.0, drill_mm: 1.5, plated: true}
    - {x_mm: 24.5, y_mm: 121.0, drill_mm: 1.5, plated: true}
    - {x_mm: 3.5, y_mm: 118.0, drill_mm: 1.5, plated: true}
  placement:
    - {ref: ANT1, role: wifi_antenna, side: top, x_mm: 10.0, y_mm: 1.8, rot_deg: 0}
    - {ref: U5, role: wifi_bt_ic, side: top, x_mm: 10.0, y_mm: 9.0, rot_deg: 0}
    - {ref: MK1, role: rear_mic, side: bottom, x_mm: 16.2, y_mm: 2.6, rot_deg: 0, feature: F_REAR_MIC, tolerance_mm: 1.0}
    - {ref: D1, role: rear_flash_led, side: bottom, x_mm: 16.2, y_mm: 11.0, rot_deg: 0, feature: F_REAR_FLASH, tolerance_mm: 1.0}
