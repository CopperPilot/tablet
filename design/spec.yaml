requirements:
  - id: R1
    text: "Compact 8-inch-class Android tablet about 134 x 198 x 9.4 mm with 14 mm corner radius and CNC aluminium back shell"
    how_met: "134.0 x 198.0 x 9.4 mm envelope (10.4 mm at camera bump), 14.0 mm corner radius, 1.0 mm wall CNC 6061-T6 aluminium back_shell with top-edge plastic RF window and 0.5 mm thermal pad + graphite sheet to SoC shield"
    quantity: "134 x 198 x 9.4 mm, R14 mm corners"
  - id: R2
    text: "Rear camera ring 13.5 mm across and 1 mm proud at [14.8, 14.8] mm, rear mic hole 1 mm across at [14.8, 24.6] mm, rear LED flash window 5.6 mm across at [14.8, 33.0] mm, nothing else on back"
    how_met: "F_REAR_CAM (13.5 mm, +1.0 mm bump at [14.8, 14.8]), F_REAR_MIC (1.0 mm hole at [14.8, 24.6] over MK1), and F_REAR_FLASH (5.6 mm window at [14.8, 33.0] over D1 driven by AW3641EDNR U7), with no rear logo or plastic strip"
    quantity: "3 rear features on x=14.8 mm line"
  - id: R3
    text: "Sharp LQ084R1SX01 8.4-inch 1600x2560 dual-channel MIPI-DSI display driven by both RK3566 DSI ports, mainboard WLED boost driver, and bonded cover-glass touch sensor over I2C + INT + RST"
    how_met: "Purchased LQ084R1SX01 wired to 40-pin FPC J1 carrying RK3566 MIPI-DSI0 + MIPI-DSI1 (8 lanes total), TPS61165DRVR WLED boost U6 on mainboard, and 10-pin touch FPC J2 linking the bonded COF mutual-capacitance X/Y touch controller via U16 TMUX1112RSVR bus-isolation switch (TP_I2C1_SCL, TP_I2C1_SDA, TP_COF_INT_L) and TP_RST_L while always-on MPR121QR2 U9 on VCC_1V8 monitors peripheral grip/SAR electrode TP_ELE0 via 1k R65"
    quantity: "8.4 in, 1600 x 2560, 2x4 MIPI-DSI lanes"
  - id: R4
    text: "8-layer 0.8 mm ENIG mainboard (28 x 125 mm) along long edge with RK3566 (C2943786), 4 GB LPDDR4X within 15 mm, 64 GB eMMC 5.1, RK817/RK809 PMIC + TCS4525-class CPU buck, 4x M1.4 holes, shield frames, <=1.2 mm top / <=1.0 mm bottom height"
    how_met: "28.0 x 125.0 x 0.8 mm 8-layer JLCPCB board with RK3566 U1, K4FBE3D4HM-MGCJ 4 GB LPDDR4X U2 at 13.5 mm centre distance, FEMDNN064G-C9A61 64 GB eMMC U3, RK809-5/RK817 PMIC U4, RK860-0 CPU buck U8, 4x M1.4 mounting holes, and SH1/SH2 shield frames"
    quantity: "28 x 125 x 0.8 mm, 8 layers"
  - id: R5
    text: "Declare high-speed groups for every DDR byte lane, CA group, DSI0, DSI1, camera CSI, and USB 2.0 with impedance targets"
    how_met: "9 high_speed groups in electrical.high_speed covering all 4 LPDDR4X byte lanes (40 ohm SE / 80 ohm diff), LPDDR4X CA/CLK bus, MIPI-DSI0, MIPI-DSI1, MIPI-CSI cameras (100 ohm diff), and USB 2.0 OTG (90 ohm diff)"
    quantity: "9 high-speed constraint groups"
  - id: R6
    text: "USB-C daughter board (12 x 25 mm) centred on bottom edge with 5.1k CC pull-downs for 5V/3A sink, ESD on CC and D+/D-, and 0.5 mm FPC to mainboard"
    how_met: "usbc_board (25.0 x 12.0 mm) at bottom edge with TYPE-C-31-M-12 J1, TPS259470ARPWR active 6.54V typ (6.32V..6.75V) OVP / 5.94V typ (5.77V min) recovery / 2.43A typ (2.19A min, 2.68A max) OCP eFuse U2 (R6=34.8k C47493, R7=5.62k C25909, R8=9.09k C11549, R9=1.37k C423239, C5=4.7nF C1538 on DVDT Pin 7 setting dV/dt=5.11V/ms, local output cap C4=1uF C52923 + Schottky freewheeling clamp diode D5=PMEG3005EL,315 C282565 on VBUS, and wide stitched F.Cu/B.Cu polygon pours on VBUS_IN and VBUS, with mainboard U11 BQ25895 input current limit capped <= 2.00 A [10.0 W max for the 2.4 W typ / 6.0 W peak tablet] below U2 I_OL(min) = 2.19 A), 2.0 uF 50V unswitched VBUS_IN capacitance (C1 1 uF 50V C1518208 + 0.33W 0603 R3 2.2R C445778 / C3 1 uF 50V C15849 RC damper) + D3 ESTVS2200DRVR (C42400188, V_RWM=22V, V_BR=25.8V, V_CL=27.6V typ / 28.6V max < 28.8V U2 abs max), 6.8 kOhm 1% CC1/CC2 pull-downs R1/R2 (0402WGF6801TCE C25917, yielding Rd(eff) = 6.8 kOhm || [10 kOhm R4/R5 + 10 kOhm R49/R50] = 5.075 kOhm within 5.1 kOhm +/- 10%) + PTVS5V5D1BLYL D1/D2 + 10 kOhm series isolation resistors R4/R5, USBLC6-2P6 ESD protection U1 with Pin 5 on USB_ESD_VBUS decoupled by 100 nF 50V C2 to GND and biased at ~4.7V DC from VBUS via 1.0 kOhm R10 (C11702) and BAS70L,315 blocking diode D4 (C456141), and 16-pin 0.5 mm FPC J2 linked to mainboard J6 via 2 oz heavy-copper Type-B FFC (6 VBUS pins = 3.00 A contact rating > 2.68 A max U2 OCP)"
    quantity: "25 x 12 mm sub-board, 5 V / 3 A sink"
  - id: R7
    text: "Single 1S Li-Po battery (18-25 Wh) with NTC and protection board filling interior, top and bottom stereo micro-speakers, front and rear MIPI-CSI cameras, and top + volume buttons on a small flex"
    how_met: "LP3698162-5600 1S 3.8V 21.28 Wh Li-Po pouch cell (98 x 162 x 3.6 mm) covering >75% of free floor, top/bottom speaker modules driven by RK817/RK809 codec + NS4150B Class-D amp, rear 8MP + front 5MP MIPI-CSI cameras, and button_board flex"
    quantity: "21.28 Wh 1S Li-Po, 2 speakers, 2 cameras, 3 buttons"
decisions:
  - question: "Bring-up risk 1: RK3566 dual-DSI pixel clock vs Sharp LQ084R1SX01 1600 x 2560 resolution"
    choice: "Drive Sharp LQ084R1SX01 in 8-lane dual-channel MIPI-DSI mode (DSI0 + DSI1) and reduce refresh rate to 50-54 Hz if 60 Hz exceeds VOP2 pixel clock"
    reason: "1600 x 2560 (4.096 MP) is approximately 11% above the RK3566 datasheet's listed dual-DSI limit (2560 x 1440 @ 60 Hz = 3.686 MP), so the panel may require a reduced refresh rate (~54 Hz) during bring-up."
  - question: "Bring-up risk 2: SoC upgrade path for full 1600 x 2560 @ 60+ Hz"
    choice: "Document Rockchip RK3576 as the architectural SoC upgrade path"
    reason: "The Rockchip RK3576 is the direct upgrade path when full-rate 2560x1600 @ 60/120 Hz dual-DSI bandwidth and higher NPU/CPU headroom are required."
  - question: "Sharp LQ084R1SX01 dual-DSI FPC pinout modelling"
    choice: "Model the 40-pin 0.5 mm display FPC connector (J1, FPC-0.5HF-40PWBH10) after the closest Sharp dual-DSI sibling (Sharp LQ101R1SX01) with separate WLED anode/cathode pins driven by mainboard TPS61165DRVR boost converter U6"
    reason: "LQ084R1SX01 uses Sharp's standard 40-pin dual-channel MIPI-DSI (4 lanes Master DSI0 + 4 lanes Slave DSI1 + VDD_1V8 + VCC_3V3 + LCD_RST + LCD_EN + LED+/LED-) assignment."
  - question: "PMIC LCSC live stock compliance (RK817-5 vs RK809-5)"
    choice: "Specify Rockchip RK809-5 (LCSC C2939628, stock > 1100) on the shared QFN-68 7x7 mm RK817-5/RK809-5 footprint alongside TCS4525-compatible RK860-0 (LCSC C19188628) external VDD_CPU buck"
    reason: "RK817-5 (C5179490) has only 5 units in live LCSC stock (<10 gate minimum), whereas RK809-5 (C2939628) shares the identical Rockchip RK817/RK809 datasheet, QFN-68 package, buck/LDO rails, fuel gauge, and Class-D audio codec with 1,188 units in stock."
  - question: "Power path verification and current budget (2.4 W typical, 6.0 W peak)"
    choice: "USB-C 5V/3A sink (R1=R2=6.8k 1% C25917 || 20k sense divider = 5.075k effective Rd, vSafe5V 4.75-5.50V passed and >6.54V typ [6.32V..6.75V] cut off by usbc_board U2 TPS259470ARPWR eFuse with 5.94V typ [5.77V min] auto-recovery, 2.43A typ [2.19A min..2.68A max] active OCP, and D3 ESTVS2200DRVR C42400188 22V standoff / 28.6V max flat-clamp surge TVS on VBUS_IN) -> BQ25895RTWR U11 1S NVDC charger (22V abs max / 14V operating VBUS input, D+/D- left open for safe 500 mA USB500 startup default until software reads 1:2 attenuated USB_CC1/USB_CC2 via R49/R50 + C73/C74 on SARADC_VIN2/3 and updates IINLIM over I2C0 capped <= 2.00 A [10.0 W max for the 2.4 W typ / 6.0 W peak tablet, backed up in hardware by R8=196 Ohm 1% C270631 on Pin 10 ILIM setting I_INMAX=1.81 A typ / 1.96 A max strictly below U2 I_OL(min) = 2.19 A, with local 1 uF 25V VBUS cap C159 C52923 at 1.04 mm from U11.1 and 7.5V standoff / 8.33V min breakdown / 12.9V max clamping surge TVS D13 SMF7.5A C123796 on VBUS at J6], regulating VSYS to >=3.5V when VBUS is present and connecting VBAT to VSYS via internal BATFET on battery alone) and 1S Li-Po (3.20-4.35V operating window with >=3.20V software/fuel-gauge low-battery cutoff threshold so VSYS >= 3.06V stays strictly above U4.54 VCC9 3.0V UVLO under 6W / 2A peak load transients, 21.28 Wh, protected by F1 BSMD0603L-300 PTC fuse + Q1 PPM6N20V10 high-side P-MOSFET reverse-polarity switch + D3 TPTVS0571P surge TVS) -> PMIC bucks/LDOs (with U4.45 VCC_RTC supplied from the highest always-present rail via ultra-low-leakage Schottky OR diodes D41/D42 BAS70L,315 C456141 from VSYS and VCC3V3_SYS) + TPS63802DLAR U12 2A synchronous buck-boost (regulating 3.52V nominal [3.43V..3.62V worst-case] VCC3V3_SYS via R39=60.4k C25911 / R40=10k C25744 in Slot 1 on PMIC_EXT_EN and supplying both U4.30 VCC6 [with 1 uF C147, providing >=220mV nominal / >=126mV worst-case hardware dropout headroom for LDO5 VCCA3V3_PHY and LDO6 VCC3V3_PMU at their 3.30V OTP default during cold boot and USB Maskrom recovery, and 420-520mV headroom when reprogrammed to 3.00-3.10V] and U4.57 VCC8 across the full 3.20-4.35V operating battery range) + TLV62569A U13 0.6V VCC0V6_DDR (enabled on BUCK_0V6_EN via 1.8V SN74LV1T34DCKR buffer U17 gated by 1.10V VCC_DDR) + RK860-0 VDD_CPU + TPS61165DRVR WLED boost + AW3641EDNR flash boost"
    reason: "BQ25895 VBUS is rated to 14V operating / 22V abs max and regulates VSYS <= 4.35V so every downstream regulator input (3.20-4.35V operating VSYS) is well within 5.5V abs max, while synchronous buck-boost U12 (TPS63802DLAR, V_IN=1.8-5.5V, R39=60.4k C25911 / R40=10k C25744 -> V_OUT=3.520V nominal [3.43V..3.62V], L10=0.47uH, C65=22uF) maintains 3.52V on VCC3V3_SYS/VCC_3V3 and U4 VCC6/VCC8 across the battery discharge range so LDO5/LDO6 have >=220mV nominal dropout headroom at their 3.30V OTP default during cold boot and USB Maskrom recovery while staying within 3.60-3.63V operating limits, ultra-low-leakage signal Schottky OR diodes D41/D42 (BAS70L,315 C456141) ensure U4.45 VCC_RTC is powered from max(VSYS, VCC3V3_SYS), and raising the low-battery cutoff threshold to >=3.20V keeps VSYS >= 3.06V above U4.54 VCC9 3.0V UVLO during 6W (2A) peak load transients. On usbc_board, D3 ESTVS2200DRVR (V_RWM=22V, V_BR=25.8V, V_CL=27.6V typ / 28.6V max < 28.8V U2 abs max) stands off 6.5V-20V DC overvoltages while U2 TPS259470ARPWR (R6=34.8k, R7=5.62k, R8=9.09k, R9=1.37k) passes the full 4.75-5.50V vSafe5V window, recovers automatically above 5.50V (5.77V min falling) after transients, provides I_OL(min)=2.19A above the <=2.00A charger IINLIM ceiling, and caps fault current at 2.68A max below the 3.0A 6-pin J2 contact rating."
  - question: "Firmware flashing and Maskrom recovery path"
    choice: "Route RK3566 USB_OTG0_DP/DM directly via the 16-pin FPC (J6 -> usbc_board J2 -> USB-C receptacle J1) with no hub or mux in the path, and provide TP_MASKROM (connected to EMMC_CLK via 0 Ohm jumper R26 C17168 while 22 Ohm series damping resistor R25 C25092 at U1.A29 limits SoC driver current during Maskrom grounding) + UART2 debug test pads (TP_UART2_TX, TP_UART2_RX, TP_GND)"
